# Razor-MCP — single-command bring-up (Razorpay TEST MODE only; no real funds move)
#
# Mongo runs as a SINGLE-NODE REPLICA SET (rs0). This is required, not cosmetic:
#   - mcp-server uses multi-document transactions for all-or-nothing checkout (stock rollback).
#   - agent-service wraps wallet debit + transaction insert + Razorpay order creation in an ACID session.
# Standalone mongod cannot open transactions; the replica set can.

services:
  mongo:
    image: mongo:7
    container_name: razor-mcp-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: razormcp
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { db.hello().isWritablePrimary ? quit(0) : quit(1) } catch (e) { quit(1) }"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: razor-mcp-mcp-server
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/razormcp?replicaSet=rs0
      MCP_PORT: "4000"
      SEED_CATALOG: "true"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  ws-gateway:
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    container_name: razor-mcp-ws-gateway
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/razormcp?replicaSet=rs0
      WS_PORT: "4001"
      WS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "4001:4001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    container_name: razor-mcp-agent-service
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/razormcp?replicaSet=rs0
      MCP_SERVER_URL: http://mcp-server:4000
      WS_GATEWAY_URL: http://ws-gateway:4001
      AGENT_PORT: "5000"
      SEED_WALLETS: "true"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      ws-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at BUILD time by Next.js — must be a build arg.
        NEXT_PUBLIC_WS_GATEWAY_URL: ${NEXT_PUBLIC_WS_GATEWAY_URL:-http://localhost:4001}
    container_name: razor-mcp-web
    env_file: .env
    environment:
      AGENT_SERVICE_URL: http://agent-service:5000
      MCP_SERVER_URL: http://mcp-server:4000
      NEXT_PUBLIC_WS_GATEWAY_URL: "http://localhost:4001"
    ports:
      - "3000:3000"
    depends_on:
      agent-service:
        condition: service_healthy
      ws-gateway:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

volumes:
  mongo_data:
